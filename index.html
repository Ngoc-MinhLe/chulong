<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timemark Watermark Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: #111827; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-bottom: 20px; color: #f5a623; font-size: 24px; }
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111827; z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    #login-box { background: #1f2937; padding: 30px; border-radius: 8px; text-align: center; border: 1px solid #374151; }
    #login-box h2 { color: #f5a623; margin-bottom: 20px; }
    .login-input { padding: 12px; font-size: 16px; width: 250px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; display: block; margin-bottom: 10px; }
    #login-button { display: block; width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px; }
    #login-button:hover { background: #e09216; }
    #error-message { color: #f87171; margin-top: 10px; height: 20px; }

    #app-wrapper { display: none; /* Ẩn theo mặc định */ }

    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; width: 100%; }
    .form-section { flex: 1; min-width: 320px; background: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #9ca3af; font-weight: 500; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 14px; }
    .input-group { display: flex; gap: 8px; }
    .input-group input { flex: 1; }
    .btn-sub { padding: 0 12px; background: #374151; border: 1px solid #4b5563; color: #f5a623; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .btn-sub:hover { background: #4b5563; }
    .btn { display: inline-block; width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; font-size: 15px; }
    .btn:hover { background: #e09216; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }
    .preview-section { flex: 1.8; min-width: 320px; display: flex; flex-direction: column; align-items: center; }
    canvas { max-width: 100%; height: auto; border-radius: 8px; background: #000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    #status { margin-top: 10px; font-size: 14px; color: #f5a623; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div id="login-box">
      <h2>Timemark Watermark</h2>
      <input type="email" id="email-input" class="login-input" placeholder="Email">
      <input type="password" id="password-input" class="login-input" placeholder="Mật khẩu">
      <p id="error-message"></p>
      <button id="login-button">Truy cập</button>
    </div>
  </div>

  <div id="app-wrapper">
    <h1>Timemark Watermark (Photo & Video)</h1>
    <div class="container">
    <div class="form-section">
      <div class="form-group">
        <label>1. Chọn Mẫu Con Dấu (Template):</label>
        <select id="templateSelect" onchange="applyWatermark()">
          <option value="template1">Mẫu 1: Badge Giờ Cam/Trắng (Cơ bản)</option>
          <option value="template2" selected>Mẫu 2: Giờ Khổ Lớn + Vạch Đứng (Tối giản)</option>
        </select>
      </div>
      <div class="form-group">
        <label>2. Chọn tệp (Ảnh hoặc Video):</label>
        <input type="file" id="mediaInput" accept="image/*,video/*">
      </div>
      <div class="form-group">
        <label>3. Tên đơn vị / Nhãn:</label>
        <input type="text" id="labelInput" value="">
      </div>
      <div class="form-group">
        <label>4. Giờ (HH:MM):</label>
        <input type="time" id="timeInput" onchange="applyWatermark()">
      </div>
      <div class="form-group">
        <label>5. Ngày tháng:</label>
        <input type="date" id="dateInput" onchange="applyWatermark()">
      </div>
      <div class="form-group">
        <label>6. Tọa độ GPS (Nếu có):</label>
        <div class="input-group">
          <input type="text" id="gpsInput" value="">
          <button class="btn-sub" onclick="getCurrentGPS()">📍 GPS thực</button>
        </div>
      </div>
      <div class="form-group">
        <label>7. Địa chỉ:</label>
        <input type="text" id="addressInput" value="">
      </div>
      <div class="form-group">
        <label>8. Mã Verify:</label>
        <div class="input-group">
          <input type="text" id="verifyInput" readonly>
          <button class="btn-sub" onclick="regenerateCode()">🎲 Mã mới</button>
        </div>
      </div>
      
      <button class="btn" onclick="applyWatermark()">Cập Nhật Con Dấu</button>
      <button class="btn btn-download" id="downloadBtn" onclick="downloadMedia()">Tải Tệp Về</button>
      <a id="view-log-btn" href="log.html" target="_blank" class="btn" style="background-color: #374151; margin-top: 20px; display: none;">Xem Log Hoạt Động</a>
    </div>

    <div class="preview-section">
      <canvas id="canvas"></canvas>
      <div id="status"></div>
      <video id="hiddenVideo" loop muted playsinline style="display:none;"></video>
    </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>

  <!-- App Config (đã bị xóa) -->

  <!-- Firebase Init & Logging Logic -->
  <script src="firebase-init.js"></script>

  <!-- Main App Logic -->
  <script src="app.js"></script> 

  <!-- Login Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginScreen = document.getElementById('login-screen');
      const appWrapper = document.getElementById('app-wrapper');
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const loginButton = document.getElementById('login-button');
      const errorMessage = document.getElementById('error-message');

      async function attemptLogin() {
        const email = emailInput.value;
        const password = passwordInput.value;
        errorMessage.textContent = '';
        loginButton.disabled = true;

        try {
          const userCredential = await auth.signInWithEmailAndPassword(email, password);
          const user = userCredential.user;

          // KIỂM TRA QUYỀN ADMIN SAU KHI ĐĂNG NHẬP
          const adminDoc = await db.collection('admins').doc(user.uid).get();
          if (adminDoc.exists) {
            // Nếu là admin, hiển thị nút xem log
            document.getElementById('view-log-btn').style.display = 'block';
          }

          loginScreen.style.display = 'none'; // Ẩn màn hình đăng nhập
          appWrapper.style.display = 'block'; // Hiển thị ứng dụng
        } catch (error) {
          errorMessage.textContent = 'Email hoặc mật khẩu không đúng!';
        }
        loginButton.disabled = false;
      }

      loginButton.addEventListener('click', attemptLogin);
      passwordInput.addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
          attemptLogin();
        }
      });

      emailInput.focus();
    });
  </script>
</body>
</html>
