<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timemark Watermark Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: #111827; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-bottom: 20px; color: #f5a623; font-size: 24px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; width: 100%; }
    .form-section { flex: 1; min-width: 320px; background: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #9ca3af; font-weight: 500; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 14px; }
    .input-group { display: flex; gap: 8px; }
    .input-group input { flex: 1; }
    .btn-sub { padding: 0 12px; background: #374151; border: 1px solid #4b5563; color: #f5a623; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .btn-sub:hover { background: #4b5563; }
    .btn { display: inline-block; width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; font-size: 15px; }
    .btn:hover { background: #e09216; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }
    .preview-section { flex: 1.8; min-width: 320px; display: flex; flex-direction: column; align-items: center; }
    canvas { max-width: 100%; height: auto; border-radius: 8px; background: #000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    #status { margin-top: 10px; font-size: 14px; color: #f5a623; }
  </style>
</head>
<body>
  <script>
    // Yêu cầu mật khẩu để truy cập
    (function() {
      const correctPassword = "long123321";
      const enteredPassword = prompt("Vui lòng nhập mật khẩu để sử dụng:");
      if (enteredPassword === correctPassword) {
        // Nếu đúng, hiển thị nội dung chính của trang
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementById('app-wrapper').style.display = 'block';
        });
      } else {
        // Nếu sai, hiển thị thông báo lỗi và ẩn nội dung
        document.body.innerHTML = '<div style="text-align: center; padding-top: 50px; color: #f87171;"><h1>Mật khẩu không đúng!</h1><p>Vui lòng tải lại trang và thử lại.</p></div>';
      }
    })();
  </script>
  <div id="app-wrapper" style="display: none;">
    <h1>Timemark Watermark (Photo & Video)</h1>
    <div class="container">
    <div class="form-section">
      <div class="form-group">
        <label>1. Chọn Mẫu Con Dấu (Template):</label>
        <select id="templateSelect" onchange="applyWatermark()">
          <option value="template1">Mẫu 1: Badge Giờ Cam/Trắng (Cơ bản)</option>
          <option value="template2" selected>Mẫu 2: Giờ Khổ Lớn + Vạch Đứng (Tối giản)</option>
        </select>
      </div>
      <div class="form-group">
        <label>2. Chọn tệp (Ảnh hoặc Video):</label>
        <input type="file" id="mediaInput" accept="image/*,video/*">
      </div>
      <div class="form-group">
        <label>3. Tên đơn vị / Nhãn:</label>
        <input type="text" id="labelInput" value="Cửa Hàng Tạp Hóa PhiLip">
      </div>
      <div class="form-group">
        <label>4. Giờ (HH:MM):</label>
        <input type="text" id="timeInput">
      </div>
      <div class="form-group">
        <label>5. Ngày tháng:</label>
        <input type="text" id="dateInput">
      </div>
      <div class="form-group">
        <label>6. Thứ trong tuần:</label>
        <input type="text" id="dayNameInput">
      </div>
      <div class="form-group">
        <label>7. Tọa độ GPS (Nếu có):</label>
        <div class="input-group">
          <input type="text" id="gpsInput" value="">
          <button class="btn-sub" onclick="getCurrentGPS()">📍 GPS thực</button>
        </div>
      </div>
      <div class="form-group">
        <label>8. Địa chỉ:</label>
        <input type="text" id="addressInput" value="Thôn Đầm Môn, X.Vạn Thạnh, H.Vạn Ninh, Khánh Hòa">
      </div>
      <div class="form-group">
        <label>9. Mã Verify:</label>
        <div class="input-group">
          <input type="text" id="verifyInput" readonly>
          <button class="btn-sub" onclick="regenerateCode()">🎲 Mã mới</button>
        </div>
      </div>
      
      <button class="btn" onclick="applyWatermark()">Cập Nhật Con Dấu</button>
      <button class="btn btn-download" id="downloadBtn" onclick="downloadMedia()">Tải Tệp Về</button>
    </div>

    <div class="preview-section">
      <canvas id="canvas"></canvas>
      <div id="status"></div>
      <video id="hiddenVideo" loop muted playsinline style="display:none;"></video>
    </div>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
