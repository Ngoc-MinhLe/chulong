<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timemark Watermark Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: #111827; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-bottom: 20px; color: #f5a623; font-size: 24px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; width: 100%; }
    .form-section { flex: 1; min-width: 320px; background: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #9ca3af; font-weight: 500; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 14px; }
    .verify-box { display: flex; gap: 8px; }
    .verify-box input { flex: 1; }
    .btn-rand { padding: 0 12px; background: #374151; border: 1px solid #4b5563; color: #f5a623; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .btn-rand:hover { background: #4b5563; }
    .btn { display: inline-block; width: 100%; padding: 12px; background: #f5a623; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; font-size: 15px; }
    .btn:hover { background: #e09216; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }
    .preview-section { flex: 1.8; min-width: 320px; display: flex; justify-content: center; align-items: flex-start; }
    canvas { max-width: 100%; height: auto; border-radius: 8px; background: #000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>

  <h1>Timemark Watermark Generator</h1>

  <div class="container">
    <div class="form-section">
      <div class="form-group">
        <label>1. Chọn ảnh gốc:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      <div class="form-group">
        <label>2. Tên đơn vị / Nhãn:</label>
        <input type="text" id="labelInput" value="Le Ngoc Minh Multimedia">
      </div>
      <div class="form-group">
        <label>3. Giờ (HH:MM):</label>
        <input type="text" id="timeInput">
      </div>
      <div class="form-group">
        <label>4. Ngày tháng:</label>
        <input type="text" id="dateInput">
      </div>
      <div class="form-group">
        <label>5. Địa chỉ:</label>
        <input type="text" id="addressInput" value="13 Ngõ 149 Phủ Thượng Đoạn, Đông Hải, Hải Phòng">
      </div>
      <div class="form-group">
        <label>6. Mã Verify (Căn giữa cạnh phải):</label>
        <div class="verify-box">
          <input type="text" id="verifyInput" readonly>
          <button class="btn-rand" onclick="regenerateCode()">🎲 Mã mới</button>
        </div>
      </div>
      
      <button class="btn" onclick="drawWatermark()">Cập Nhật Con Dấu</button>
      <button class="btn btn-download" onclick="downloadImage()">Tải Ảnh Về</button>
    </div>

    <div class="preview-section">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let uploadedImage = null;

    // Lấy ngày giờ hiện tại trên máy đặt làm mặc định
    function setCurrentDateTime() {
      const now = new Date();
      
      // Giờ HH:MM
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('timeInput').value = `${hours}:${minutes}`;

      // Ngày tháng dạng: "Thứ ..., DD Tháng M,YYYY"
      const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
      const dayName = days[now.getDay()];
      const day = String(now.getDate()).padStart(2, '0');
      const month = now.getMonth() + 1;
      const year = now.getFullYear();

      document.getElementById('dateInput').value = `${dayName}, ${day} Tháng ${month},${year}`;
    }

    // Sinh chuỗi mã xác minh ngẫu nhiên 14 ký tự
    function generateRandomVerifyCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < 14; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result + ' Timemark Verified';
    }

    // Thiết lập dữ liệu ban đầu
    setCurrentDateTime();
    document.getElementById('verifyInput').value = generateRandomVerifyCode();

    function regenerateCode() {
      document.getElementById('verifyInput').value = generateRandomVerifyCode();
      drawWatermark();
    }

    document.fonts.ready.then(() => {
      drawWatermark();
    });

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImage = new Image();
        uploadedImage.onload = function() {
          canvas.width = uploadedImage.width;
          canvas.height = uploadedImage.height;
          document.getElementById('verifyInput').value = generateRandomVerifyCode();
          drawWatermark();
        };
        uploadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawWatermark() {
      if (!uploadedImage) {
        canvas.width = 900;
        canvas.height = 1200;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "20px 'Roboto', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Vui lòng chọn ảnh để xem kết quả...", canvas.width/2, canvas.height/2);
        ctx.textAlign = "left";
        return;
      }

      ctx.drawImage(uploadedImage, 0, 0);

      const scale = canvas.width / 1000; 
      
      const labelText = document.getElementById('labelInput').value;
      const timeText = document.getElementById('timeInput').value;
      const dateText = document.getElementById('dateInput').value;
      const addressText = document.getElementById('addressInput').value;
      const verifyText = document.getElementById('verifyInput').value;

      ctx.save();

      const paddingLeft = 35 * scale;
      const paddingBottom = 45 * scale;
      
      const badgeHeight = 48 * scale;
      const addressBlockHeight = 110 * scale;
      const totalWatermarkHeight = badgeHeight + addressBlockHeight;
      
      const startY = canvas.height - paddingBottom - totalWatermarkHeight;

      // 1. BADGE GIỜ & NHÃN
      ctx.font = `bold ${19 * scale}px 'Roboto', sans-serif`;
      const labelWidth = ctx.measureText(labelText).width + (28 * scale);
      
      ctx.font = `bold ${32 * scale}px 'Roboto Condensed', sans-serif`;
      const timeWidth = ctx.measureText(timeText).width + (28 * scale);
      const totalBadgeWidth = labelWidth + timeWidth;

      ctx.fillStyle = "#ffffff";
      drawRoundedRect(ctx, paddingLeft, startY, totalBadgeWidth, badgeHeight, 6 * scale);
      ctx.fill();

      ctx.fillStyle = "#f5a623";
      drawRoundedRect(ctx, paddingLeft + (3 * scale), startY + (3 * scale), labelWidth - (5 * scale), badgeHeight - (6 * scale), 4 * scale);
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.font = `bold ${18 * scale}px 'Roboto', sans-serif`;
      ctx.fillText(labelText, paddingLeft + (12 * scale), startY + (31 * scale));

      ctx.fillStyle = "#091e35";
      ctx.font = `bold ${32 * scale}px 'Roboto Condensed', sans-serif`;
      ctx.fillText(timeText, paddingLeft + labelWidth + (10 * scale), startY + (34 * scale));

      // 2. NGÀY & ĐỊA CHỈ
      const infoStartY = startY + badgeHeight + (20 * scale);
      
      ctx.fillStyle = "#f5a623";
      ctx.fillRect(paddingLeft, infoStartY, 3.5 * scale, 70 * scale);

      ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
      ctx.shadowBlur = 4 * scale;
      ctx.shadowOffsetX = 1 * scale;
      ctx.shadowOffsetY = 1 * scale;

      ctx.fillStyle = "#ffffff";
      ctx.font = `500 ${22 * scale}px 'Roboto', sans-serif`;
      ctx.fillText(dateText, paddingLeft + (15 * scale), infoStartY + (18 * scale));

      ctx.font = `400 ${20 * scale}px 'Roboto Condensed', sans-serif`;
      wrapText(ctx, addressText, paddingLeft + (15 * scale), infoStartY + (48 * scale), 650 * scale, 26 * scale);

      ctx.font = `400 ${15 * scale}px 'Roboto', sans-serif`;
      ctx.fillStyle = "#e2e8f0";
      ctx.fillText("🛡 Cam kết ngày giờ chân thực bởi Timemark", paddingLeft, infoStartY + (105 * scale));

      // 3. LOGO TIMEMARK (GÓC DƯỚI PHẢI)
      const rightX = canvas.width - (160 * scale);
      const logoY = canvas.height - (55 * scale);

      ctx.font = `bold ${22 * scale}px 'Roboto', sans-serif`;
      ctx.fillStyle = "#f5a623";
      ctx.fillText("Time", rightX, logoY);

      const timeWordWidth = ctx.measureText("Time").width;
      ctx.fillStyle = "#ffffff";
      ctx.fillText("mark", rightX + timeWordWidth, logoY);

      ctx.font = `400 ${13 * scale}px 'Roboto', sans-serif`;
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("100% Chân thực", rightX, logoY + (18 * scale));

      // 4. MÃ VERIFY DỌC (CĂN GIỮA MẶT ĐỨNG CẠNH PHẢI)
      ctx.save();
      const centerY = canvas.height / 2;
      ctx.translate(canvas.width - (12 * scale), centerY);
      ctx.rotate(-Math.PI / 2); // Xoay 90 độ ngược chiều kim đồng hồ
      ctx.font = `400 ${12 * scale}px 'Roboto', sans-serif`;
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      ctx.textAlign = "center"; // Căn giữa dòng chữ dọc theo vị trí centerY
      ctx.fillText("🛡 " + verifyText, 0, 0);
      ctx.restore();

      ctx.restore();
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Hàm tạo tên file tải về chuẩn Timemark
    function downloadImage() {
      if (!uploadedImage) {
        alert("Vui lòng chọn ảnh trước!");
        return;
      }
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const filename = `Timemark_${year}${month}${day}_${hours}${minutes}${seconds}.png`;

      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    drawWatermark();
  </script>
</body>
</html>
